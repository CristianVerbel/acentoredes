name: Deploy Supabase Edge Function

# Despliega la Edge Function "ingest" automáticamente cuando cambia su código.
# También se puede lanzar a mano desde la pestaña Actions ("Run workflow").
#
# Requisitos (GitHub -> Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  -> token personal de Supabase
#                             (https://supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF   -> ref del proyecto (xxxx en xxxx.supabase.co)
#
# Nota: esta Action solo despliega el CÓDIGO. Los secrets de la función
# (TWITTER_BEARER_TOKEN, YOUTUBE_API_KEY, ANTHROPIC_API_KEY, INGEST_SECRET) se
# configuran en Supabase -> Edge Functions -> Manage secrets.

on:
  push:
    branches:
      - main
      # Rama de desarrollo actual; añade/ajusta las que uses.
      - claude/digital-listening-elections-qKs21
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-edge-function.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Desplegar función "ingest"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy ingest --project-ref "$SUPABASE_PROJECT_REF"

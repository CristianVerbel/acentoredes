version: "3.8"

services:
  openclaw:
    image: node:22-slim
    container_name: acentoredes-openclaw
    restart: unless-stopped
    working_dir: /app
    volumes:
      - openclaw_data:/root/.openclaw
      - ./openclaw.config.yaml:/root/.openclaw/config.yaml:ro
    ports:
      - "${GATEWAY_PORT:-18789}:18789"
    environment:
      - NODE_ENV=production
      - OPENCLAW_MODEL_PROVIDER=${OPENCLAW_MODEL_PROVIDER:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
    entrypoint: >
      sh -c "
        npm install -g openclaw@latest &&
        openclaw gateway --port 18789 --verbose
      "
    stdin_open: true
    tty: true

volumes:
  openclaw_data:
    driver: local
